name: Bug report
description: Report a crash, incorrect output, or a flag that does not work as expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: npx vibe-preflight --html
  - type: input
    id: preflight-version
    attributes:
      label: Preflight version
      description: "Paste the output of `npx vibe-preflight --version`."
  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: e.g. Node 22 on Ubuntu 24.04
